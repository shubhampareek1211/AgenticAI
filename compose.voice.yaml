# Optional local worker. Overlay with compose.yaml to keep its PostgreSQL volume.
# docker compose -f compose.yaml -f compose.voice.yaml up -d --build
services:
  voice:
    build:
      context: ./deploy/voice
      dockerfile: Dockerfile
      args:
        MODEL: ${VOICE_MODEL:-base.en}
        MODEL_SHA256: ${VOICE_MODEL_SHA256:-a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002}
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
