[project]
name = "gemini-web-tool-calling"
version = "0.1.0"
description = "Cricket analyst chat app: FastAPI + LiteLLM + Gemini with visible tool calls"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "jsonschema>=4.18,<5",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "firebase-admin>=7.7,<8",
    "google-auth>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9"]


[tool.ruff]
target-version = "py310"
line-length = 100
