# Build only the pilot gateway and private application backend.
# The Whisper and Kokoro services are unchanged.
# Manual candidate: gcloud builds submit . --config cloudbuild.pilot-app.yaml --region us-central1
# This file never deploys a Cloud Run revision.
steps:
  - id: backend-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --platform=linux/amd64
      - -f
      - deploy/app/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/agenticai-pilot/backend:$BUILD_ID
      - .
  - id: gateway-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --platform=linux/amd64
      - -f
      - deploy/gateway/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/agenticai-pilot/gateway:$BUILD_ID
      - .
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/agenticai-pilot/backend:$BUILD_ID
  - us-central1-docker.pkg.dev/$PROJECT_ID/agenticai-pilot/gateway:$BUILD_ID
options:
  logging: CLOUD_LOGGING_ONLY
