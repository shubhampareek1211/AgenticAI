# Attach only to a separate pilot GitHub trigger after the pilot service has
# already been configured and validated. Never attach this to agenticai-git.
# Trigger pushes to the dedicated pilot-release branch.
steps:
  - id: backend-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --platform=linux/amd64
      - -f
      - deploy/app/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/agenticai-pilot/backend:$BUILD_ID
      - .
  - id: gateway-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --platform=linux/amd64
      - -f
      - deploy/gateway/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/agenticai-pilot/gateway:$BUILD_ID
      - .
  - id: push-backend
    name: gcr.io/cloud-builders/docker
    waitFor: [backend-image]
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/agenticai-pilot/backend:$BUILD_ID
  - id: push-gateway
    name: gcr.io/cloud-builders/docker
    waitFor: [gateway-image]
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/agenticai-pilot/gateway:$BUILD_ID
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-backend, push-gateway]
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - agenticai-data-pilot
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/agenticai-pilot/backend:$BUILD_ID
      - --region=us-central1
      - --project=$PROJECT_ID
      - --quiet
  - id: deploy-gateway
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [deploy-backend]
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - agenticai-columbia-pilot
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/agenticai-pilot/gateway:$BUILD_ID
      - --region=us-central1
      - --project=$PROJECT_ID
      - --quiet
options:
  logging: CLOUD_LOGGING_ONLY
